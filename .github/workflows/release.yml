name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        run: pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > version.txt
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          export VERSION
          node <<'NODE'
          const fs = require('fs');
          const version = process.env.VERSION;
          if (!version) throw new Error('VERSION env missing');
          const p = 'desktop/package.json';
          const j = JSON.parse(fs.readFileSync(p, 'utf8'));
          j.version = version;
          fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
          console.log('desktop/package.json ->', version);
          NODE

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Make Windows icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop\build | Out-Null
          python -c @"
          from PIL import Image
          img = Image.open('analytics.png').convert('RGBA')
          img.save('AppIcon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          img.save('desktop/build/icon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('icons created')
          "@

      - name: Build Python sidecar
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File desktop/scripts/build-backend.ps1
          if (-not (Test-Path "desktop\backend\AnalizIstoriiBackend.exe")) {
            Get-ChildItem -Recurse desktop\backend | Select-Object -First 40 FullName
            throw "AnalizIstoriiBackend.exe missing in desktop/backend"
          }

      - name: Install Electron deps
        working-directory: desktop
        run: npm ci

      - name: Build Electron (win-unpacked)
        working-directory: desktop
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --x64 --dir
          if (-not (Test-Path "release\win-unpacked\AnalizIstorii.exe")) {
            Get-ChildItem -Recurse release | Select-Object -First 40 FullName
            throw "AnalizIstorii.exe missing in win-unpacked"
          }
          # ensure runtime data next to exe (extraFiles may already copy these)
          Copy-Item -Force ..\version.txt release\win-unpacked\version.txt
          Copy-Item -Force ..\KSGoperacii.csv release\win-unpacked\KSGoperacii.csv

      - name: Create ZIP and SHA-256
        shell: pwsh
        run: |
          $out = "desktop\release"
          Set-Location "$out\win-unpacked"
          7z a -tzip ..\AnalizIstorii.zip *
          Set-Location ..
          $hash = (Get-FileHash AnalizIstorii.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AnalizIstorii.zip" | Out-File -FilePath AnalizIstorii.zip.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"
          Get-Item AnalizIstorii.zip | Format-List Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/release/AnalizIstorii.zip
            desktop/release/AnalizIstorii.zip.sha256
          name: "Release ${{ github.ref_name }}"
          body: |
            Автосборка Windows ${{ github.ref_name }} — **Electron UI**

            ### Установка
            1. Скачайте `AnalizIstorii.zip`
            2. Распакуйте в любую папку (лучше не в OneDrive и не в Program Files)
            3. Запустите `AnalizIstorii.exe`

            Python устанавливать не нужно.

            ### Важно при обновлении с 1.1.2 и раньше
            Старые сборки были на Tkinter. Для перехода на Electron лучше
            **удалить старую папку** и распаковать zip заново (не поверх `_internal`).

            ### Проверка целостности
            Сверьте SHA-256 с файлом `AnalizIstorii.zip.sha256`.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
