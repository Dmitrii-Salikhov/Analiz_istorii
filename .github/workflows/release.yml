name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        run: pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set version from tag
        shell: bash
        run: bash .github/scripts/set-version.sh

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Make icons
        run: python desktop/scripts/make-icons.py

      - name: Build Python sidecar
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File desktop/scripts/build-backend.ps1
          if (-not (Test-Path "desktop\backend\AnalizIstoriiBackend.exe")) {
            Get-ChildItem -Recurse desktop\backend | Select-Object -First 40 FullName
            throw "AnalizIstoriiBackend.exe missing in desktop/backend"
          }

      - name: Install Electron deps
        working-directory: desktop
        run: npm ci

      - name: Build Electron (win-unpacked)
        working-directory: desktop
        shell: pwsh
        run: |
          npm run build
          npx electron-builder --win --x64 --dir
          if (-not (Test-Path "release\win-unpacked\AnalizIstorii.exe")) {
            Get-ChildItem -Recurse release | Select-Object -First 40 FullName
            throw "AnalizIstorii.exe missing in win-unpacked"
          }
          Copy-Item -Force ..\version.txt release\win-unpacked\version.txt
          Copy-Item -Force ..\KSGoperacii.csv release\win-unpacked\KSGoperacii.csv

      - name: Create ZIP and SHA-256
        shell: pwsh
        run: |
          $out = "desktop\release"
          Set-Location "$out\win-unpacked"
          7z a -tzip ..\AnalizIstorii.zip *
          Set-Location ..
          $hash = (Get-FileHash AnalizIstorii.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AnalizIstorii.zip" | Out-File -FilePath AnalizIstorii.zip.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"
          Get-Item AnalizIstorii.zip | Format-List Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            desktop/release/AnalizIstorii.zip
            desktop/release/AnalizIstorii.zip.sha256

  build-linux:
    needs: test
    # Ubuntu 20.04 base → glibc 2.31, совместимо с ALT SP 10.2 (glibc 2.32).
    runs-on: ubuntu-latest
    container:
      image: ubuntu:20.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system deps
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates curl git zip \
            build-essential python3-dev \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils \
            libatspi2.0-0 libdrm2 libgbm1 libasound2 \
            libx11-xcb1 libxcb-dri3-0 libxcomposite1 libxdamage1 libxrandr2 \
            libpango-1.0-0 libcairo2 libgdk-pixbuf2.0-0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set version from tag
        run: bash .github/scripts/set-version.sh

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Make icons
        run: python desktop/scripts/make-icons.py

      - name: Build Python sidecar
        run: bash desktop/scripts/build-backend.sh

      - name: Install Electron deps
        working-directory: desktop
        run: npm ci

      - name: Build Electron (linux-unpacked)
        working-directory: desktop
        run: |
          npm run build
          npx electron-builder --linux --x64 --dir
          test -f release/linux-unpacked/AnalizIstorii || {
            ls -la release/linux-unpacked | head -30
            exit 1
          }

      - name: Create ZIP and SHA-256
        run: bash desktop/scripts/package-linux-unpacked.sh

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            desktop/release/AnalizIstorii-linux.zip
            desktop/release/AnalizIstorii-linux.zip.sha256

  publish:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows/AnalizIstorii.zip
            artifacts/windows/AnalizIstorii.zip.sha256
            artifacts/linux/AnalizIstorii-linux.zip
            artifacts/linux/AnalizIstorii-linux.zip.sha256
          name: "Release ${{ github.ref_name }}"
          body: |
            Автосборка **Electron UI** — ${{ github.ref_name }}

            ### Windows
            1. Скачайте `AnalizIstorii.zip`
            2. Распакуйте в любую папку (лучше не в OneDrive и не в Program Files)
            3. Запустите `AnalizIstorii.exe`

            ### Linux (x86_64, portable folder)
            1. Скачайте `AnalizIstorii-linux.zip`
            2. Распакуйте в домашнюю папку (без установки и sudo)
            3. Запустите `./AnalizIstorii` из распакованной папки

            Сборка Linux выполнена на базе Ubuntu 20.04 для совместимости с **glibc 2.32+**
            (в т.ч. ALT SP Workstation 10.2, X11). Python устанавливать не нужно.

            ### Важно при обновлении с 1.1.2 и раньше (Windows)
            Старые сборки были на Tkinter. Для перехода на Electron лучше
            **удалить старую папку** и распаковать zip заново (не поверх `_internal`).

            ### Проверка целостности
            - Windows: `AnalizIstorii.zip.sha256`
            - Linux: `AnalizIstorii-linux.zip.sha256`
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
