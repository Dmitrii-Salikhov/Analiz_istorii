name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Pytest
        run: pytest

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "$VERSION" > version.txt
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Make Windows icon
        shell: pwsh
        run: |
          python -c @"
          from PIL import Image
          img = Image.open('analytics.png').convert('RGBA')
          img.save('AppIcon.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])
          print('AppIcon.ico created')
          "@

      - name: Build PyInstaller onedir
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --windowed `
            --onedir `
            --name AnalizIstorii `
            --icon AppIcon.ico `
            --add-data "version.txt;." `
            --add-data "KSGoperacii.csv;." `
            --hidden-import gui `
            --hidden-import gui.app `
            --hidden-import gui.lor_frame `
            --hidden-import gui.ksg_frame `
            --hidden-import gui.settings_dialog `
            --hidden-import gui.widgets `
            --hidden-import gui.helpers `
            --hidden-import gui.ui_theme `
            --hidden-import gui.chrome `
            --hidden-import gui.whats_new `
            --hidden-import changelog `
            --hidden-import updater `
            --hidden-import config_store `
            --hidden-import report_profiles `
            --hidden-import excel_io `
            --hidden-import lor_analysis `
            --hidden-import ksg_analysis `
            --hidden-import paths `
            --hidden-import certifi `
            --hidden-import openpyxl `
            --hidden-import matplotlib.backends.backend_tkagg `
            --collect-all ttkbootstrap `
            --collect-all matplotlib `
            main.py

      - name: Copy runtime files next to exe
        shell: cmd
        run: |
          copy /Y version.txt dist\AnalizIstorii\version.txt
          copy /Y KSGoperacii.csv dist\AnalizIstorii\KSGoperacii.csv
          if exist AppIcon.ico copy /Y AppIcon.ico dist\AnalizIstorii\AppIcon.ico

      - name: Create ZIP and SHA-256
        shell: pwsh
        run: |
          # Архив содержимого папки (exe + _internal), без лишней вложенности —
          # после распаковки сразу виден AnalizIstorii.exe
          Set-Location dist\AnalizIstorii
          7z a -tzip ..\AnalizIstorii.zip *
          Set-Location ..
          $hash = (Get-FileHash AnalizIstorii.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  AnalizIstorii.zip" | Out-File -FilePath AnalizIstorii.zip.sha256 -Encoding ascii
          Write-Host "SHA256: $hash"
          Get-Item AnalizIstorii.zip | Format-List Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/AnalizIstorii.zip
            dist/AnalizIstorii.zip.sha256
          name: "Release ${{ github.ref_name }}"
          body: |
            Автосборка Windows ${{ github.ref_name }}

            ### Установка
            1. Скачайте `AnalizIstorii.zip`
            2. Распакуйте в любую папку (лучше не в OneDrive и не в Program Files)
            3. Запустите `AnalizIstorii.exe`

            Python устанавливать не нужно.

            ### Если автообновление «откатывает» версию
            Закройте программу, удалите старую папку и распакуйте этот zip заново
            (или замените содержимое папки вручную). С версии 1.0.9 установщик обновлений исправлен.

            ### Проверка целостности
            Сверьте SHA-256 с файлом `AnalizIstorii.zip.sha256`.
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
